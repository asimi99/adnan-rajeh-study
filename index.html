function momentsFor(paras,terms,rawq,max){

}

 if(ytAPI){ytCmd('seekTo',[t,true]);ytCmd('playVideo')}else{const id=location.hash.slice(3).split('~')[0];fr.src=embed(id,t,true)}
 const p=document.getElementById('player');if(p&&p.getBoundingClientRect().top<0)p.scrollIntoView({block:'start'})}
document.addEventListener('click',e=>{
 if(e.target.id==='popbtn'){popOpen(location.hash.slice(3).split('~')[0],+(location.hash.split('~')[1]||0));return}
 if(e.target.id==='pmini'){const p=$('#player');p.classList.toggle('mini');e.target.textContent=p.classList.contains('mini')?'Larger':'Smaller';return}
 const a=e.target.closest('a[href*="youtube.com/watch"]');if(!a||a.closest('.pbar'))return;
 if(e.metaKey||e.ctrlKey||e.shiftKey)return;
 const u=new URL(a.href);const vid=u.searchParams.get('v');const t=parseInt(u.searchParams.get('t')||'0',10)||0;if(!vid||!byId[vid])return;
 e.preventDefault();
 const cur=location.hash.startsWith('#v-')?location.hash.slice(3).split('~')[0]:null;
 if(noEmbed){document.querySelectorAll('a.ts.on').forEach(x=>x.classList.remove('on'));if(a.classList.contains('ts'))a.classList.add('on');popOpen(vid,t);return}
 if(cur===vid&&document.getElementById('ytf')){document.querySelectorAll('a.ts.on').forEach(x=>x.classList.remove('on'));if(a.classList.contains('ts'))a.classList.add('on');seek(t)}
 else location.hash='#v-'+vid+(t?'~'+t:'');
});
// rows that carry a time become the link: tap the text, the player jumps there
const ROWS='.outline>div,.span,.verse,.narr>div,.kv>div,.moment,.rg,.cites>span,.node li';
function wireJumps(root){root.querySelectorAll('a.ts').forEach(a=>{const r=a.closest(ROWS);if(!r||r.classList.contains('jump'))return;if(r.querySelectorAll('a.ts').length!==1&&!r.matches('.rg'))return;if(r.closest('.side')||r.classList.contains('side'))return;r.classList.add('jump');r.dataset.href=a.href})}
new MutationObserver(()=>wireJumps(main)).observe(main,{childList:true,subtree:true});
document.addEventListener('click',e=>{if(e.target.dataset&&e.target.dataset.syn)return;const r=e.target.closest('.jump');if(!r)return;const inner=e.target.closest('a');if(inner&&!inner.classList.contains('ts')&&inner.closest('.jump')===r&&!/youtube\.com\/watch/.test(inner.href))return;
 e.preventDefault();e.stopPropagation();document.querySelectorAll('.jump.on').forEach(x=>x.classList.remove('on'));r.classList.add('on');const a=document.createElement('a');a.href=r.dataset.href;a.className='ts';a.dataset.syn='1';r.appendChild(a);a.click();a.remove()},true);
const setTop=()=>{const t=document.querySelector('.top');if(t)document.documentElement.style.setProperty('--toph',t.offsetHeight+'px')};
window.addEventListener('resize',setTop);setTop();
$('#foot').textContent=`Catalog of ${catalog.length.toLocaleString()} recordings from the Adnan Rajeh and Muslim Wellness channels · ${own.filter(c=>c.tx).length} transcribed · tap a line to play from there`;
route();
})();
</script></body></html>
