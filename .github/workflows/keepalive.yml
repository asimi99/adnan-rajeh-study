name: Supabase keepalive
on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database
        run: |
          # 200 or a Postgres permission error (42501) both mean the request reached the database.
          out=$(curl -sS --retry 3 --retry-delay 10 -w '\n%{http_code}' \
            "https://rxkitwtfgbhgyneapgfx.supabase.co/rest/v1/user_data?select=*&limit=1" \
            -H "apikey: sb_publishable_a_sszD017JtDTmQ5e_ERLQ_lW9z-e96")
          echo "$out"
          if echo "$out" | tail -n1 | grep -q '^200$' || echo "$out" | grep -q '42501'; then exit 0; fi
          exit 1
